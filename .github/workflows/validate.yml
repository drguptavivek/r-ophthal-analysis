name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install survey for the prevalence helper test
        run: Rscript -e 'install.packages("survey")'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run base-R tests
        run: Rscript --vanilla tests/run_tests.R

      - name: Run readiness self-test
        run: Rscript --vanilla scripts/selftest.R

      - name: Verify Agent Skill discovery
        shell: bash
        run: |
          # Write the listing to a file first: grep -q closes a pipe early and npx then fails with EPIPE
          npx -y skills add . --list > "$RUNNER_TEMP/skills-list.txt"
          grep -q 'ophthal-analysis' "$RUNNER_TEMP/skills-list.txt"

      - name: Verify Antigravity CLI installation
        shell: bash
        run: |
          skill_source="$GITHUB_WORKSPACE"
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npx -y skills add "$skill_source" --skill ophthal-analysis --agent antigravity-cli --copy --yes
          test -f .agents/skills/ophthal-analysis/SKILL.md
          test -f .agents/skills/ophthal-analysis/examples/r/publication_tables.Rmd
          test -f .agents/skills/ophthal-analysis/references/component-stata-reporting.md
          test -f .agents/skills/ophthal-analysis/references/burden-projection.md
          test -f .agents/skills/ophthal-analysis/reference-data/india-population/project_district_population.R
          test -f .agents/skills/ophthal-analysis/reference-data/india-population/india_district_population_projection_2026.csv.gz

  validate-windows-build-tools:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R and its matching Windows toolchain
        uses: r-lib/actions/setup-r@v2

      - name: Run base-R tests
        run: Rscript --vanilla tests/run_tests.R

      - name: Require a working source-package toolchain
        run: Rscript --vanilla scripts/selftest.R --require-build-tools
