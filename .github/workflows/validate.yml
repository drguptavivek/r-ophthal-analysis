name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run base-R tests
        run: Rscript --vanilla tests/run_tests.R

      - name: Run readiness self-test
        run: Rscript --vanilla scripts/selftest.R

      - name: Verify Agent Skill discovery
        run: npx -y skills add . --list | grep -q 'ophthal-analysis'

      - name: Verify Antigravity CLI installation
        shell: bash
        run: |
          skill_source="$GITHUB_WORKSPACE"
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npx -y skills add "$skill_source" --skill ophthal-analysis --agent antigravity-cli --copy --yes
          test -f .agents/skills/ophthal-analysis/SKILL.md
          test -f .agents/skills/ophthal-analysis/examples/r/publication_tables.Rmd
          test -f .agents/skills/ophthal-analysis/references/component-stata-reporting.md

  validate-windows-build-tools:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R and its matching Windows toolchain
        uses: r-lib/actions/setup-r@v2

      - name: Run base-R tests
        run: Rscript --vanilla tests/run_tests.R

      - name: Require a working source-package toolchain
        run: Rscript --vanilla scripts/selftest.R --require-build-tools
